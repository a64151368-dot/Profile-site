<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мій професійний профіль</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #efe9d8; }
body {
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

.viewport {
  position: fixed; inset: 0;
  overflow: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.viewport::-webkit-scrollbar { display: none; }

.stage {
  --sx: 0; --sy: 0;                     /* напрямок світла (керується курсором) */
  position: relative;
  width: max(100vw, calc(100vh * 1672 / 940));
  height: max(100vh, calc(100vw * 940 / 1672));
  background: #efe9d8;
}

/* Фон: чіткіші написи й зображення (різкість + легкий контраст) */
.stage > img.bg {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  object-fit: fill; user-select: none; -webkit-user-drag: none;
  filter: url(#sharpen) contrast(1.06) saturate(1.08);
  image-rendering: -webkit-optimize-contrast;
}

/* Кнопки розміщені поверх фонового банера без додаткових плашок. */
/* ---------- Мітка ---------- */
.pin {
  --c1: #ffffff; --c2: #73cdb2; --c3: #279b7d; --ring: 90, 205, 174;
  position: absolute;
  width: 52px; height: 52px; margin: -26px 0 0 -26px;
  display: grid; place-items: center;
  text-decoration: none; border-radius: 50%; outline: none;
  z-index: 2; -webkit-tap-highlight-color: transparent;
  transition: transform .22s cubic-bezier(.2,.8,.2,1), filter .22s ease;
}
.pin:hover, .pin:focus-visible { z-index: 10; transform: translateY(-2px) scale(1.06); filter: brightness(1.08); }

.halo {
  position: absolute; width: 50px; height: 50px; border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--ring), .75) 0%, rgba(var(--ring), .25) 50%, rgba(var(--ring), 0) 72%);
  animation: breathe 2.4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes breathe {
  0%, 100% { transform: scale(.85); opacity: .75; }
  50%      { transform: scale(1.25); opacity: 1; }
}

.ring {
  position: absolute; width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid rgba(var(--ring), .95);
  box-shadow: 0 0 10px rgba(var(--ring), .8);
  animation: ping 2.4s cubic-bezier(.2,.6,.3,1) infinite;
  pointer-events: none;
}
@keyframes ping {
  0%   { transform: scale(.8); opacity: .95; }
  100% { transform: scale(2.6); opacity: 0; }
}

.dot {
  position: relative; display: grid; place-items: center;
  width: 46px; height: 46px; border-radius: 50%;
  background: radial-gradient(circle at 32% 25%, var(--c1), var(--c2) 56%, var(--c3));
  border: 2px solid rgba(255,255,255,.98);
  box-shadow: 0 3px 8px rgba(28,65,65,.18), 0 0 0 1px rgba(255,255,255,.4),
              0 0 17px rgba(var(--ring), .58);
  transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease, filter .22s ease;
}
.dot::after {
  content: ""; width: 10px; height: 10px;
  border-top: 3px solid #fff; border-right: 3px solid #fff;
  transform: translateX(-2px) rotate(45deg);
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.12));
}
.pin:hover .dot, .pin:focus-visible .dot {
  transform: scale(1.08);
  box-shadow: 0 5px 12px rgba(28,65,65,.24), 0 0 0 3px rgba(255,255,255,.96),
              0 0 0 7px rgba(var(--ring), .24), 0 0 30px rgba(var(--ring), .95);
  filter: saturate(1.2) brightness(1.06);
}
.pin:active .dot { transform: scale(1.1); }
.pin:focus-visible { box-shadow: 0 0 0 3px #3d7a44; }

/* ---------- Підпис ---------- */
.label {
  position: absolute; left: 50%; bottom: calc(100% - 4px);
  transform: translate(-50%, 6px) scale(.96);
  padding: 8px 13px; border-radius: 12px;
  background: linear-gradient(160deg, #3b6444, #2a4a31);
  color: #fff; font-size: 13px; font-weight: 600; line-height: 1.2; white-space: nowrap;
  box-shadow: 0 10px 22px rgba(25,45,30,.4), 0 2px 4px rgba(25,45,30,.3);
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .22s cubic-bezier(.34,1.56,.64,1);
}
.label::after {
  content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px;
  border: 6px solid transparent; border-top-color: #2a4a31;
}
.pin:hover .label, .pin:focus-visible .label { opacity: 1; transform: translate(-50%, 0) scale(1); }

.pin.below .label { bottom: auto; top: calc(100% - 4px); }
.pin.below .label::after { top: auto; bottom: 100%; border-top-color: transparent; border-bottom-color: #2a4a31; }

.pin.left .label { left: auto; right: calc(100% - 6px); bottom: auto; top: 50%; transform: translate(6px, -50%) scale(.96); }
.pin.left:hover .label, .pin.left:focus-visible .label { transform: translate(0, -50%) scale(1); }
.pin.left .label::after { top: 50%; left: 100%; margin: -6px 0 0 0; border-top-color: transparent; border-left-color: #2a4a31; }

.pin.right .label { left: calc(100% - 6px); bottom: auto; top: 50%; transform: translate(-6px, -50%) scale(.96); }
.pin.right:hover .label, .pin.right:focus-visible .label { transform: translate(0, -50%) scale(1); }
.pin.right .label::after { top: 50%; left: auto; right: 100%; margin: -6px 0 0 0; border-top-color: transparent; border-right-color: #2a4a31; }

@media (hover: none) {
  .label { opacity: 1; transform: translate(-50%, 0) scale(1); font-size: 11px; padding: 5px 9px; }
  .pin.left .label, .pin.right .label { transform: translate(0, -50%) scale(1); }
}

/* ---------- «Подяка» ---------- */
.pin.thanks { --c1: #fff5f7; --c2: #f28eaa; --c3: #d94d78; --ring: 242, 126, 162; }
.pin.thanks .body { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.pin.thanks .label { background: linear-gradient(160deg, #a1445f, #7f3049); }
.pin.thanks .label::after { border-top-color: #7f3049; }
.pin.thanks.right .label::after { border-top-color: transparent; border-right-color: #7f3049; }

.pin.green { --c1: #ffffff; --c2: #9ce0c8; --c3: #55b99b; --ring: 105, 210, 180; }
.pin.blue { --c1: #ffffff; --c2: #8bc8f0; --c3: #429bd5; --ring: 112, 190, 238; }
.pin.lavender { --c1: #ffffff; --c2: #c2b4f3; --c3: #8d79d9; --ring: 177, 155, 238; }
.pin.gold { --c1: #ffffff; --c2: #ffd58a; --c3: #e6a83f; --ring: 255, 202, 111; }
.pin.teal { --c1: #ffffff; --c2: #8ed7c8; --c3: #48ad9c; --ring: 110, 210, 192; }

.body { position: relative; display: grid; place-items: center; width: 100%; height: 100%; }

@media (prefers-reduced-motion: reduce) {
  .halo, .ring, .pin.thanks .body { animation: none !important; }
  .ring { opacity: .5; }
}
</style>
</head>
<body>

<!-- фільтр різкості для фонового зображення -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="sharpen" color-interpolation-filters="sRGB">
    <feConvolveMatrix order="3" preserveAlpha="true" kernelMatrix="0 -0.45 0  -0.45 2.8 -0.45  0 -0.45 0"/>
  </filter>
</svg>

<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <img class="bg" id="bg" alt="Мій професійний профіль — документи, досвід і рішення" draggable="false">
  </div>
</div>

<script>
(function () {
  var FILE_ID = '15jncejHzLmvfVGDOA01mWCALvkXiJzEE';
  var RATIO_W = 1672, RATIO_H = 940;

  var LINKS = {
    resume:       'https://canva.link/zmomzk1wc83qhk6',
    education:    'https://canva.link/if0x8trumu3y448',
    vector:       'https://canva.link/cfus5g3r8eog1go',   // індивідуальний план = вектор професійного розвитку
    problems:     'https://canva.link/xzx1j6a01jjt7wt',
    attestation:  'https://drive.google.com/file/d/1t92M6BPWflSn6EvGWPa1j7DApauwpxrE/view?usp=drive_link',
    thanks:       'https://canva.link/utwxrb4mh5d6q6g',
    certificates: 'https://a64151368-dot.github.io/certificates/'
  };

  // Центри круглих кнопок на наданому банері (у відсотках).
  var PINS = [
    { id:'education',    label:'Освіта і кваліфікація',        x:30.58, y:45.21, cls:'green' },
    { id:'vector',       label:'Вектор професійного розвитку', x:61.43, y:45.21, cls:'blue' },
    { id:'problems',     label:'Методична проблема',           x:93.13, y:45.21, cls:'lavender' },
    { id:'attestation',  label:'Попередній атестаційний лист', x:30.58, y:69.89, cls:'gold' },
    { id:'certificates', label:'Сертифікати',                  x:61.43, y:69.89, cls:'teal' },
    { id:'thanks',       label:'Подяки',                       x:93.13, y:69.89, pos:'left', cls:'thanks' }
  ];

  /* ----- Новий фоновий банер із GitHub; резервні адреси попереднього фону ----- */
  var bg = document.getElementById('bg');
  var src = [
    'https://raw.githubusercontent.com/a64151368-dot/Profile-site/main/%D0%9C%D1%96%D0%B8%CC%86%20%D0%BF%D1%80%D0%BE%D1%84%D0%B5%D1%81%D1%96%D0%B8%CC%86%D0%BD%D0%B8%D0%B8%CC%86%20%D0%BF%D1%80%D0%BE%D1%84%D1%96%D0%BB%D1%8C_%20%D0%BE%D1%81%D0%B2%D1%96%D1%82%D0%BD%D1%96%D0%B8%CC%86%20%D0%B4%D0%B0%D1%88%D0%B1%D0%BE%D1%80%D0%B4.png',
    'https://lh3.googleusercontent.com/d/' + FILE_ID + '=w3000',
    'https://drive.google.com/thumbnail?id=' + FILE_ID + '&sz=w3000',
    'https://drive.google.com/uc?export=view&id=' + FILE_ID
  ], i = 0;
  bg.onerror = function () { if (++i < src.length) bg.src = src[i]; };
  bg.src = src[0];

  /* ----- На весь екран (cover) + центрування ----- */
  var viewport = document.getElementById('viewport');
  var stage = document.getElementById('stage');

  function fit() {
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    var k = Math.max(vw / RATIO_W, vh / RATIO_H);
    stage.style.width  = (RATIO_W * k) + 'px';
    stage.style.height = (RATIO_H * k) + 'px';
  }
  function center() {
    viewport.scrollLeft = (stage.offsetWidth  - viewport.clientWidth)  / 2;
    viewport.scrollTop  = (stage.offsetHeight - viewport.clientHeight) / 2;
  }
  fit(); center();
  window.addEventListener('resize', function () { fit(); center(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { fit(); center(); }, 150); });

  /* ----- Мітки ----- */
  PINS.forEach(function (p, n) {
    var a = document.createElement('a');
    a.className = 'pin' + (p.cls ? ' ' + p.cls : '') + (p.pos ? ' ' + p.pos : '');
    a.href = LINKS[p.id];
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('aria-label', p.label);
    a.style.left = p.x + '%';
    a.style.top = p.y + '%';
    var d = n * 0.25;
    a.innerHTML =
      '<span class="body">' +
        '<span class="halo" style="animation-delay:' + d + 's"></span>' +
        '<span class="ring" style="animation-delay:' + d + 's"></span>' +
        '<span class="ring" style="animation-delay:' + (d + 0.8) + 's"></span>' +
        '<span class="dot"></span>' +
      '</span>' +
      '<span class="label">' + p.label + '</span>';
    stage.appendChild(a);
  });
})();
</script>
</body>
</html>
